name: Refresh job board

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        run: |
          for i in 1 2 3; do
            if curl -sS -f -X POST --max-time 120 https://internify-gzsg-nu.vercel.app/api/sync; then
              echo "Sync triggered"
              exit 0
            fi
            echo "Attempt $i failed, retrying"
            sleep 15
          done
          exit 1